catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:

shellEmulator: true
trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.2.0
    '@antfu/ni': ^30.3.0
    '@commitlint/cli': ^21.2.1
    '@commitlint/config-conventional': ^21.2.0
    '@commitlint/types': ^21.2.0
    bumpp: ^12.1.1
    eslint: ^10.8.0
    nano-staged: ^1.0.2
    publint: ^0.3.22
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.14
    tsx: ^4.23.5
    typescript: ^6.0.3
    vite: ^8.2.0
  core:
    axios: ^1.19.0
    es-toolkit: ^1.50.0
    qs: ^6.15.3
  testing:
    axios-mock-adapter: ^2.1.0
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.2.0
    vitest: ^4.1.10
  types:
    '@types/node': ^26.1.2
    '@types/qs': ^6.15.1
allowBuilds:
  esbuild: true
  simple-git-hooks: true
