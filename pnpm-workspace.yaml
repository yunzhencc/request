shellEmulator: true

trustPolicy: no-downgrade

allowBuilds:
  core-js: false
  esbuild: false
  simple-git-hooks: true

catalogs:
  cli:
    '@antfu/eslint-config': ^9.2.0
    '@commitlint/cli': ^21.2.1
    '@commitlint/config-conventional': ^21.2.0
    '@commitlint/types': ^21.2.0
    bumpp: ^12.0.0
    eslint: ^10.8.0
    lint-staged: ^17.3.0
    publint: ^0.3.22
    simple-git-hooks: ^2.13.1
    tsdown: ^0.22.14
    tsx: ^4.23.1
    typescript: ~6.0.3
  core:
    axios: ^1.19.0
    es-toolkit: ^1.50.0
    qs: ^6.15.3
  test:
    axios-mock-adapter: ^2.1.0
    tsdown-stale-guard: ^0.1.3
    vitest: ^4.1.10
  types:
    '@types/node': ^26.1.2
    '@types/qs': ^6.15.1
